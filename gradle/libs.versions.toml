[versions]
kotlin = "2.4.21"
clikt = "5.1.0"
kotlinx-serialization = "1.13.0"
junit = "6.1.3"
kotest = "6.2.7"
slf4j = "2.0.20"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
# composite build で ../kotlin-core-app のプロジェクトに置き換わるので、バージョンは持たない
core-db = { module = "io.github.boarnasia.core:db" }
core-user = { module = "io.github.boarnasia.core:user" }
core-staff = { module = "io.github.boarnasia.core:staff" }
core-item = { module = "io.github.boarnasia.core:item" }
core-notice = { module = "io.github.boarnasia.core:notice" }
core-order = { module = "io.github.boarnasia.core:order" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
